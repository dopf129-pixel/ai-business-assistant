name: Docs Reconcile Once

on:
  push:
    branches:
      - docs/reconcile-return-inventory-recovery-v1291-v1300
    paths:
      - .github/workflows/docs-reconcile-once.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-return-inventory-recovery-v1291-v1300
          fetch-depth: 0

      - name: Patch append-only Project Brain docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_map = Path('project_brain/TEST_MAP.md')
          text = test_map.read_text(encoding='utf-8')
          old = """Latest confirmed full-suite baseline:\n\n2195 passed on `9ca4497dda61615076b8203d0404502630ab7e81`.\n\nGitHub Actions push Verify #1105 completed successfully for this exact main SHA.\n"""
          new = """Latest confirmed full-suite baseline:\n\n2208 passed on `3f82b65054a2a7a48b9918803c197377bdb3557f`.\n\nGitHub Actions push Verify #1131 completed successfully for this exact main SHA.\n"""
          if old not in text and new not in text:
              raise SystemExit('TEST_MAP current-status anchor not found')
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('TEST_MAP current-status anchor is ambiguous')
              text = text.replace(old, new, 1)

          section = r'''

---

# Return Inventory Recovery Evidence v1

Boundaries:

- `ReturnInventoryRecoveryRepository`
- `PeriodProfitReturnCogsRecoveryEvidenceService`
- `create_period_profit_query`
- `build_period_profit_response`
- `build_period_profit_coverage`
- `record_return_inventory_recovery.py`
- Decision 040

Tests:

- `tests/test_return_inventory_recovery_evidence_v1291_v1300.py`
- updated `tests/test_period_profit_factory.py`

Проверяет:

- explicit `SALEABLE_RESTORED` evidence is persisted and read by exact return identity;
- explicit `NON_SALEABLE` evidence is preserved as a blocking recovery state;
- invalid state and invalid/non-positive/boolean quantity fail closed;
- duplicate `return_id + confirmed_on` evidence is rejected;
- identity drift for one `return_id` becomes conflict/unconfirmed;
- missing recovery evidence remains unknown and never infers recovery from current stock or stock delta;
- exact evidence quantity must match candidate return quantity;
- quantity mismatch blocks saleable recovery confirmation;
- one explicit non-saleable candidate blocks aggregate saleable recovery confirmation;
- compensated returns stay outside saleable recovery candidacy;
- repository exceptions are contained and do not fabricate recovery evidence;
- complete explicit saleable recovery can confirm `saleable_inventory_recovery_confirmed=True` without changing Period Profit;
- response wording exposes explicit recovery state and remaining accounting blockers;
- coverage exposes inventory-recovery completeness/counts without an accounting-net-profit claim;
- `originating_sale_quantity_confirmed=False` remains explicit;
- `recovery_period_attribution_confirmed=False` remains explicit;
- `compensation_accounting_treatment_confirmed=False` remains explicit;
- `confirmed_cogs_recovery_amount=0.0`;
- `profit_adjustment_allowed=False`;
- `automatic_recovery_allowed=False`;
- current Ozon stock observations/deltas are never accepted as recovery proof.

Verification:

- entering exact docs-reconciled main `7f859d1073338c5c0144edea8fe15574460e5210`: Verify #1115, 2195 passed / 0 failed, artifact 9906440691, digest `sha256:42618c7cd0f12fdd9b1c49f2231c990c71c6931727af3a09e1035719f248929a`;
- failed `41b409edcd2a96016bf49e8e8303a7aec00c1886`: Verify #1125, compile failure (`SyntaxError`), no verification artifact;
- failed `4643126328c9e461712aae30f5f7a694a7549e89`: Verify #1126, compile failure at `app/period_profit_response.py:706`, no verification artifact;
- failed `d90549d21c8fb46b0a9012c205520c68e012dbfa`: Verify #1127, compile failure with unmatched `)` at `app/period_profit_response.py:744`, no verification artifact;
- failed `13e4cfbacf617bb60c5b897137b619f079c3d500`: Verify #1128, 2203 passed / 5 failed, artifact 9906768012, digest `sha256:59dd7f0d342951b258bdef1d45b934cd107a858fc986d9326d1f06df016c2944`;
- final feature `1a83e5466bfebd79370e9576ce00b43b79bb668d`: Verify #1129, 2208 passed / 0 failed, artifact 9906795648, digest `sha256:a20b8f66b8d28365b7c9d887250782e7ab01d7885ddcca75c5bfab90541bd875`;
- PR #395 synthetic `7d7b3a5e180a2505850345cc753a7d40ba391cbf`: Verify #1130, 2208 passed / 0 failed, artifact 9906847145, digest `sha256:36f7babc92f4f0d39e708927a61e95122eada8b76892dc4eb7da8912f3e01fa4`;
- squash main `3f82b65054a2a7a48b9918803c197377bdb3557f`: Verify #1131, 2208 passed / 0 failed, artifact 9906878610, digest `sha256:45eb967f32521ae3c7a2007663f6acfffcf6fa2f1fbdddb58bc332f56a02311d`;
- failed SHAs remain failed evidence permanently and carry no transferable success claim;
- `externally_verified=False`.
'''
          if '# Return Inventory Recovery Evidence v1' not in text:
              text = text.rstrip() + section + '\n'
          test_map.write_text(text, encoding='utf-8')

          changelog = Path('project_brain/CHANGELOG.md')
          log = changelog.read_text(encoding='utf-8')
          entry = r'''

## 2026-09-04 — Return Inventory Recovery Evidence v1291-v1300

- added Decision 040 for explicit return-inventory recovery evidence;
- added append-only `return_inventory_recovery_history` with exact return ID, posting number, SKU, positive quantity, explicit recovery state, confirmation date and source;
- supported recovery states are exactly `SALEABLE_RESTORED` and `NON_SALEABLE`;
- missing recovery evidence remains unknown rather than becoming saleable, non-saleable or zero;
- duplicate return/date evidence is rejected and identity drift becomes conflict/unconfirmed;
- saleable recovery requires exact candidate quantity match;
- compensated returns remain outside automatic saleable-recovery candidacy;
- current Ozon stock snapshot or stock delta is never automatic proof of return recovery;
- explicit saleable recovery may now be confirmed independently from sale lineage and historical cost basis;
- recovery accounting-period attribution, originating sale quantity and compensation accounting treatment remain unconfirmed;
- `confirmed_cogs_recovery_amount=0.0`, `profit_adjustment_allowed=False`, `automatic_recovery_allowed=False`;
- Period Profit formula remains unchanged;
- failed `41b409edcd2a96016bf49e8e8303a7aec00c1886`: Verify #1125 compile failure, no verification artifact;
- failed `4643126328c9e461712aae30f5f7a694a7549e89`: Verify #1126 compile failure, no verification artifact;
- failed `d90549d21c8fb46b0a9012c205520c68e012dbfa`: Verify #1127 compile failure, no verification artifact;
- failed `13e4cfbacf617bb60c5b897137b619f079c3d500`: Verify #1128, 2203 passed / 5 failed, artifact 9906768012, digest `sha256:59dd7f0d342951b258bdef1d45b934cd107a858fc986d9326d1f06df016c2944`;
- final feature `1a83e5466bfebd79370e9576ce00b43b79bb668d`: Verify #1129, 2208 passed / 0 failed, artifact 9906795648, digest `sha256:a20b8f66b8d28365b7c9d887250782e7ab01d7885ddcca75c5bfab90541bd875`;
- PR #395 synthetic `7d7b3a5e180a2505850345cc753a7d40ba391cbf`: Verify #1130, 2208 passed / 0 failed, artifact 9906847145, digest `sha256:36f7babc92f4f0d39e708927a61e95122eada8b76892dc4eb7da8912f3e01fa4`;
- squash main `3f82b65054a2a7a48b9918803c197377bdb3557f`: Verify #1131, 2208 passed / 0 failed, artifact 9906878610, digest `sha256:45eb967f32521ae3c7a2007663f6acfffcf6fa2f1fbdddb58bc332f56a02311d`;
- Decision 036/037/038/039 remain unchanged;
- no Ozon mutation or Product Decision/Product Task Draft execution;
- `data/users.json` unchanged;
- `externally_verified=False`.

## 2026-09-04 — Project Brain reconciliation after v1291-v1300

- reconciles PROJECT_STATE, CURRENT_STATE, ROADMAP, TEST_MAP, VERIFICATION_STATUS and CHANGELOG to exact verified product main `3f82b65054a2a7a48b9918803c197377bdb3557f` / Verify #1131 / 2208 passed;
- adds `CURRENT_CHECKPOINT_V1291_V1300.md` with Decision 040 and exact SHA-bound product verification evidence;
- preserves all failed #1125-#1128 evidence without reclassification;
- DECISIONS is not changed in the docs package because Decision 040 is already part of the production commit;
- next material accounting gap is recovery period attribution + originating sale quantity consistency + compensation double-count protection;
- docs only; no runtime/data change in reconciliation;
- `data/users.json` unchanged;
- `externally_verified=False`.
'''
          if '## 2026-09-04 — Return Inventory Recovery Evidence v1291-v1300' not in log:
              log = log.rstrip() + entry + '\n'
          changelog.write_text(log, encoding='utf-8')
          PY

      - name: Commit patched docs
        shell: bash
        run: |
          if git diff --quiet -- project_brain/TEST_MAP.md project_brain/CHANGELOG.md; then
            echo "No docs changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_brain/TEST_MAP.md project_brain/CHANGELOG.md
          git commit -m "docs: reconcile return inventory recovery test map and changelog"
          git push origin HEAD:docs/reconcile-return-inventory-recovery-v1291-v1300
