name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: app
      OZON_CLIENT_ID: ""
      OZON_API_KEY: ""
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Initialize deterministic test schema
        run: python -c "from database import create_tables; create_tables()"

      - name: Record revision metadata
        run: |
          mkdir -p verification-artifacts
          printf 'commit_sha=%s\n' "$GITHUB_SHA" > verification-artifacts/revision.txt
          printf 'ref=%s\n' "$GITHUB_REF" >> verification-artifacts/revision.txt
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> verification-artifacts/revision.txt
          printf 'run_number=%s\n' "$GITHUB_RUN_NUMBER" >> verification-artifacts/revision.txt
          python --version >> verification-artifacts/revision.txt

      - name: Run full test suite
        run: python -m pytest -q --junitxml=verification-artifacts/pytest-junit.xml

      - name: Build production Docker image
        run: |
          IMAGE="ai-business-assistant:verify-${GITHUB_SHA}"
          docker build --pull=false --tag "$IMAGE" .
          printf 'docker_image=%s\n' "$IMAGE" >> verification-artifacts/revision.txt
          docker image inspect "$IMAGE" --format 'image_id={{.Id}}' >> verification-artifacts/revision.txt

      - name: Smoke production Docker runtime
        run: |
          IMAGE="ai-business-assistant:verify-${GITHUB_SHA}"
          MASTER_KEY="$(docker run --rm --entrypoint python "$IMAGE" -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          docker run --rm \
            --entrypoint python \
            -e TELEGRAM_BOT_TOKEN=verification-token \
            -e OZON_CREDENTIAL_MASTER_KEY="$MASTER_KEY" \
            -e AI_ASSISTANT_STORAGE_ROOT=/tmp \
            "$IMAGE" \
            -m runtime_healthcheck
          docker run --rm \
            --entrypoint python \
            "$IMAGE" \
            -c 'import telegram_api_bot, runtime_healthcheck; print("container imports ok")'

      - name: Generate SHA-bound test report
        if: always()
        run: |
          python -m ci_verification_manifest \
            --junit verification-artifacts/pytest-junit.xml \
            --output verification-artifacts/test-report.json \
            --commit-sha "$GITHUB_SHA" \
            --workflow "$GITHUB_WORKFLOW" \
            --event "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: verification-artifacts/
          if-no-files-found: error
          retention-days: 14
