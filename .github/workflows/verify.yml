name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: app
      OZON_CLIENT_ID: ""
      OZON_API_KEY: ""
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile application
        run: python -m compileall -q app

      - name: Record revision metadata
        run: |
          mkdir -p verification-artifacts
          printf 'commit_sha=%s\n' "$GITHUB_SHA" > verification-artifacts/revision.txt
          printf 'ref=%s\n' "$GITHUB_REF" >> verification-artifacts/revision.txt
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" >> verification-artifacts/revision.txt
          python --version >> verification-artifacts/revision.txt

      - name: Run full test suite
        run: python -m pytest -q --junitxml=verification-artifacts/pytest-junit.xml

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: verification-artifacts/
          if-no-files-found: error
          retention-days: 14
